schema_version: 1
task: generate_classification_data

real_manifest: ./benchmark_data/real_splits.csv
output_dir: ./benchmark_data/synthetic_sdss/images
manifest: ./benchmark_data/synthetic_sdss/manifest.csv
ratio: 1.0
batch_size: 16

sampling:
  method: euler
  steps: 50
  num_samples: 16
  seed: 123

sources:
  - experiment_config: ./experiments/benchmark_dragn/lora_sdss_lens/config.yaml
    weights: ema
    scale: 1.0
  - experiment_config: ./experiments/benchmark_dragn/lora_sdss_spiral/config.yaml
    weights: ema
    scale: 1.0
  - experiment_config: ./experiments/benchmark_dragn/lora_sdss_ring/config.yaml
    weights: ema
    scale: 1.0
  - experiment_config: ./experiments/benchmark_dragn/lora_sdss_companion/config.yaml
    weights: ema
    scale: 1.0
  - experiment_config: ./experiments/benchmark_dragn/lora_sdss_smooth/config.yaml
    weights: ema
    scale: 1.0
