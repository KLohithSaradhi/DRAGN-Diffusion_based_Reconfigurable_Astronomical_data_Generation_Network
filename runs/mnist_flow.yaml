run_name: "mnist_flow"
stage: "bb"
output_dir: "./results"
 

data:
  dataset_type: "mnist"
  root_dir: "./"
  condition: ""
  batch_size: 64

training:
  type: "flow"
  epochs: 200
  lr: 0.0001
  timesteps: 1000
  save_freq: 10
  schedule: "linear"
  loss_type: "mse"


diffusion:
  in_channels: 1
  latent_size: 32
  hidden_dim: 128
  num_heads: 8
  depth: 2